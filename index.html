<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatPulse - Project Hub with Google Drive Media</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        dark: {
                            bg: '#0f172a',
                            panel: '#1e293b',
                            border: '#334155',
                            accent: '#3b82f6'
                        }
                    }
                }
            }
        }
    </script>
    <!-- Google Identity Services & API Client -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script src="https://apis.google.com/js/api.js" async defer></script>
    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden">

    <div id="authModal" class="fixed inset-0 z-50 bg-[#0f172a]/95 backdrop-blur-md flex items-center justify-center p-4 hidden">
        <div class="bg-[#1e293b] border border-[#334155] rounded-2xl p-6 w-full max-w-md shadow-2xl space-y-6">
            <div class="text-center space-y-2">
                <div class="w-12 h-12 rounded-2xl bg-blue-600 flex items-center justify-center font-bold text-white text-xl mx-auto shadow-lg shadow-blue-600/30">KH</div>
                <h2 id="authModalTitle" class="text-xl font-bold text-white">Sign In to Kosha Hub</h2>
                <p class="text-xs text-slate-400">Kgotsong</p>
            </div>

            <div id="authError" class="bg-red-500/10 border border-red-500/30 text-red-400 text-xs p-3 rounded-xl hidden"></div>

            <form onsubmit="handleAuthSubmit(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Email Address</label>
                    <input type="email" id="authEmail" required placeholder="mate@example.com" 
                           class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-slate-200 focus:outline-none focus:border-blue-500 transition">
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Password</label>
                    <input type="password" id="authPassword" required placeholder="••••••••" minlength="6"
                           class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-slate-200 focus:outline-none focus:border-blue-500 transition">
                </div>

                <div class="flex items-center space-x-3 pt-2">
                    <button type="submit" id="authSubmitBtn" class="flex-1 bg-blue-600 hover:bg-blue-500 text-white py-2.5 rounded-xl font-medium text-sm transition shadow-lg shadow-blue-600/20">
                        Sign In
                    </button>
                </div>
            </form>

            <div class="text-center text-xs text-slate-400 space-y-2">
                <div id="authToggleText">Don't have an account?</div>
                <div>
                    <button type="button" onclick="toggleAuthMode()" id="authToggleBtn" class="text-blue-400 font-semibold hover:underline">Create Account instead</button>
                </div>
            </div>
        </div>
    </div>

    <header class="bg-[#1e293b] border-b border-[#334155] px-4 py-2 flex items-center justify-between shrink-0 gap-4">
        <div class="flex items-center space-x-3 shrink-0">
            <div class="w-9 h-9 rounded-xl bg-blue-600 flex items-center justify-center font-bold text-white text-base shadow-lg shrink-0">KH</div>
            <div class="hidden sm:block">
                <h1 class="font-bold text-sm leading-tight">Kosha hub</h1>
                <p class="text-[11px] text-slate-400 flex items-center gap-1 mt-0.5">
                    <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                    Connected
                </p>
            </div>
        </div>

        <!-- Horizontal Channels Bar -->
        <div class="flex-1 flex items-center space-x-2 overflow-x-auto py-1 scrollbar-none max-w-full">
            <div id="channelsList" class="flex items-center space-x-1.5 shrink-0">
                <!-- Channels rendered dynamically as horizontal tabs -->
            </div>
            
            <!-- + New Channel Button in Header -->
            <button onclick="openNewChannelModal()" class="shrink-0 text-xs bg-blue-600/20 hover:bg-blue-600/30 text-blue-400 border border-blue-500/30 px-3 py-1.5 rounded-lg font-semibold transition flex items-center gap-1 shadow-sm whitespace-nowrap" title="Create new channel">
                <span>+</span> <span>New Channel</span>
            </button>
        </div>

        <div class="flex items-center space-x-2 shrink-0">
            <div id="userBadge" onclick="openProfileModal()" class="bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs px-3 py-1.5 rounded-xl border border-slate-700 font-medium cursor-pointer transition flex items-center gap-2 shadow-sm" title="Click to change display name">
                <span>👤 Loading...</span>
            </div>
            <button onclick="logoutUser()" class="bg-red-500/10 hover:bg-red-500/20 text-red-400 border border-red-500/30 text-xs px-3 py-1.5 rounded-xl transition font-medium">
                Sign Out
            </button>
        </div>
    </header>

    <div id="profileModal" class="fixed inset-0 z-50 bg-[#0f172a]/90 backdrop-blur-md flex items-center justify-center p-4 hidden">
        <div class="bg-[#1e293b] border border-[#334155] rounded-2xl p-6 w-full max-w-md shadow-2xl space-y-6">
            <div class="flex items-center justify-between">
                <h3 class="text-lg font-bold text-white flex items-center gap-2">
                    <span>👤</span> Edit Your Profile
                </h3>
                <button onclick="closeProfileModal()" class="text-slate-400 hover:text-white font-bold text-lg px-2 py-1">✕</button>
            </div>

            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Display Name</label>
                    <input type="text" id="profileNameInput" placeholder="Enter your display name..." 
                           class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-slate-200 focus:outline-none focus:border-blue-500 transition">
                </div>
                
                <div class="flex items-center space-x-3 pt-2">
                    <button type="button" onclick="saveProfileChanges()" class="flex-1 bg-blue-600 hover:bg-blue-500 text-white py-2.5 rounded-xl font-medium text-sm transition shadow-lg shadow-blue-600/20">
                        Save Changes
                    </button>
                    <button type="button" onclick="closeProfileModal()" class="bg-slate-700 hover:bg-slate-600 text-slate-300 px-4 py-2.5 rounded-xl font-medium text-sm transition">
                        Cancel
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div class="flex-1 flex overflow-hidden">

        <div id="newChannelModal" class="fixed inset-0 z-50 bg-[#0f172a]/90 backdrop-blur-md flex items-center justify-center p-4 hidden">
            <div class="bg-[#1e293b] border border-[#334155] rounded-2xl p-6 w-full max-w-md shadow-2xl space-y-6">
                <div class="flex items-center justify-between">
                    <h3 class="text-lg font-bold text-white flex items-center gap-2">
                        <span>#</span> Create a New Channel
                    </h3>
                    <button onclick="closeNewChannelModal()" class="text-slate-400 hover:text-white font-bold text-lg px-2 py-1">✕</button>
                </div>

                <div class="space-y-4">
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Channel Name</label>
                        <input type="text" id="newChannelNameInput" placeholder="e.g. video-reviews" 
                               class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-slate-200 focus:outline-none focus:border-blue-500 transition">
                    </div>
                    
                    <div class="flex items-center space-x-3 pt-2">
                        <button type="button" onclick="createChannel()" class="flex-1 bg-blue-600 hover:bg-blue-500 text-white py-2.5 rounded-xl font-medium text-sm transition shadow-lg shadow-blue-600/20">
                            Create Channel
                        </button>
                        <button type="button" onclick="closeNewChannelModal()" class="bg-slate-700 hover:bg-slate-600 text-slate-300 px-4 py-2.5 rounded-xl font-medium text-sm transition">
                            Cancel
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Full Space WhatsApp-Style Main Chat Area -->
        <main class="flex-1 flex flex-col bg-[#0f172a] relative overflow-hidden w-full">
            
            <!-- Channel Sub-Header Info Bar -->
            <div class="bg-[#1e293b]/70 border-b border-[#334155] px-4 py-2 flex items-center justify-between shrink-0">
                <div class="flex items-center space-x-2">
                    <span class="text-blue-400 font-bold text-base">#</span>
                    <span id="activeChannelName" class="font-bold text-sm text-white">General Lobby</span>
                </div>
            </div>

            <!-- Messages Feed -->
            <div id="messageFeed" class="flex-1 overflow-y-auto p-4 md:p-6 space-y-4 max-w-5xl mx-auto w-full">
                <div class="text-center py-8 text-slate-500 text-sm">
                    Loading messages from database...
                </div>
            </div>

            <!-- Upload Progress Overlay Banner -->
            <div id="uploadProgressBanner" class="bg-blue-600/20 border-t border-blue-500/40 px-4 py-2 text-xs flex items-center justify-between hidden max-w-5xl mx-auto w-full">
                <div class="flex items-center space-x-3 text-blue-300">
                    <span class="inline-block w-4 h-4 border-2 border-blue-400 border-t-transparent rounded-full animate-spin"></span>
                    <span id="uploadProgressText">Uploading</span>
                </div>
            </div>

            <!-- Thread Reply Bar -->
            <div id="replyBar" class="bg-slate-800/90 border-t border-slate-700 px-4 py-2 text-xs flex items-center justify-between hidden max-w-5xl mx-auto w-full">
                <div class="text-slate-300 truncate">
                    Replying to <span id="replyingToUser" class="font-semibold text-blue-400"></span>: <span id="replyingToText" class="italic text-slate-400"></span>
                </div>
                <button onclick="cancelReply()" class="text-slate-400 hover:text-white font-bold px-2 py-0.5">✕</button>
            </div>

            <!-- Attachment Preview Box -->
            <div id="attachmentPreview" class="bg-slate-800/90 border-t border-slate-700 px-4 py-2 text-xs flex items-center justify-between hidden max-w-5xl mx-auto w-full">
                <div class="flex items-center space-x-2 text-slate-300">
                    <span>🎬 Selected Media File: <strong id="attachmentName" class="text-blue-400"></strong></span>
                    <span id="attachmentTypeBadge" class="bg-blue-500/20 text-blue-300 px-2 py-0.5 rounded text-[10px]"></span>
                </div>
                <button onclick="clearAttachment()" class="text-slate-400 hover:text-white font-bold px-2 py-0.5">✕</button>
            </div>

            <!-- Input Bar & Controls -->
            <div class="p-3 bg-[#1e293b] border-t border-[#334155] shrink-0">
                <form id="messageForm" onsubmit="sendMessage(event)" class="flex items-center space-x-2 max-w-5xl mx-auto">
                    <input type="file" id="fileInput" accept="video/*,audio/*,image/*" class="hidden" onchange="handleFileSelected(this)">
                    
                    <button type="button" onclick="document.getElementById('fileInput').click()" class="p-2.5 bg-slate-700 hover:bg-slate-600 text-slate-300 rounded-xl transition flex items-center gap-1.5 font-medium text-xs shrink-0" title="Upload Image, Video, or Audio file">
                        <span>📁 Upload Media</span>
                    </button>

                    <input type="text" id="messageInput" placeholder="Type a message or discuss..." 
                           class="flex-1 bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-slate-200 focus:outline-none focus:border-blue-500 transition"
                           autocomplete="off">

                    <button type="submit" class="bg-blue-600 hover:bg-blue-500 text-white px-5 py-2.5 rounded-xl font-medium text-sm transition shadow-lg shadow-blue-600/20 shrink-0">
                        Send
                    </button>
                </form>
            </div>
        </main>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, query, orderBy, onSnapshot, serverTimestamp, doc, getDoc, setDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCG22Ws561dfcZAG6j97b60RgBiEjhBN-M",
            authDomain: "chatpulse-602fc.firebaseapp.com",
            projectId: "chatpulse-602fc",
            storageBucket: "chatpulse-602fc.firebasestorage.app",
            messagingSenderId: "84743289439",
            appId: "1:84743289439:web:f8911ccddde44ce0a2b9ea"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // CLOUDINARY CONFIGURATION
        const CLOUD_NAME = "onja9ymk";
        const UPLOAD_PRESET = "chatpulse_uploads";

        window.currentChannel = "General Lobby";
        window.currentUser = null;
        window.isSignUpMode = false;
        window.replyingToMessageId = null;
        window.replyingToData = null;
        window.selectedFile = null;

        window.addEventListener('load', () => {
            // Initialization complete
        });

        function showNotification(msg) {
            const banner = document.getElementById("uploadProgressBanner");
            const textEl = document.getElementById("uploadProgressText");
            if (banner && textEl) {
                textEl.innerText = "Uploading";
                banner.classList.remove("hidden");
                setTimeout(() => banner.classList.add("hidden"), 4000);
            }
        }

        // Auth State Observer
        onAuthStateChanged(auth, async (user) => {
            const authModal = document.getElementById("authModal");
            if (user) {
                let displayName = null;
                try {
                    const userDocRef = doc(db, "users", user.uid);
                    const userSnap = await getDoc(userDocRef);
                    if (userSnap.exists() && userSnap.data().displayName) {
                        displayName = userSnap.data().displayName;
                    }
                } catch (e) {
                    console.error("Could not fetch user profile from Firestore:", e);
                }

                if (!displayName) {
                    displayName = localStorage.getItem(`chatpulse_display_${user.uid}`) || user.email.split('@')[0];
                }

                window.currentUser = displayName;
                updateUserBadgeDisplay();
                authModal.classList.add("hidden");
                loadChannels();
                loadMessages();
            } else {
                window.currentUser = null;
                const badge = document.getElementById("userBadge");
                if (badge) {
                    badge.innerHTML = `<span>👤 Guest</span>`;
                }
                authModal.classList.remove("hidden");
            }
        });

        function updateUserBadgeDisplay() {
            const badge = document.getElementById("userBadge");
            if (badge) {
                badge.innerHTML = `<span>👤 ${escapeHtml(window.currentUser)}</span> <span class="text-blue-400 text-[10px] bg-slate-900/50 px-1.5 py-0.5 rounded border border-slate-700">Edit ✏️</span>`;
            }
        }

        window.openProfileModal = function() {
            if (!auth.currentUser) return;
            const nameInput = document.getElementById("profileNameInput");
            if (nameInput) {
                nameInput.value = window.currentUser || '';
            }
            document.getElementById("profileModal").classList.remove("hidden");
            if (nameInput) nameInput.focus();
        }

        window.closeProfileModal = function() {
            document.getElementById("profileModal").classList.add("hidden");
        }

        window.saveProfileChanges = async function() {
            if (!auth.currentUser) return;
            const nameInput = document.getElementById("profileNameInput");
            const newName = nameInput ? nameInput.value.trim() : '';
            
            if (newName !== "") {
                window.currentUser = newName;
                try {
                    const userDocRef = doc(db, "users", auth.currentUser.uid);
                    await setDoc(userDocRef, { displayName: newName, email: auth.currentUser.email }, { merge: true });
                } catch (e) {
                    console.error("Error saving display name to Firestore:", e);
                }

                localStorage.setItem(`chatpulse_display_${auth.currentUser.uid}`, window.currentUser);
                updateUserBadgeDisplay();
                closeProfileModal();
                loadMessages();
            }
        }

        window.toggleAuthMode = function() {
            window.isSignUpMode = !window.isSignUpMode;
            const btn = document.getElementById("authSubmitBtn");
            const modalTitle = document.getElementById("authModalTitle");
            const toggleText = document.getElementById("authToggleText");
            const toggleBtn = document.getElementById("authToggleBtn");
            const errorEl = document.getElementById("authError");
            errorEl.classList.add("hidden");

            if (window.isSignUpMode) {
                modalTitle.innerText = "Create Account";
                btn.innerText = "Create Account & Enter";
                toggleText.innerText = "Already have an account?";
                toggleBtn.innerText = "Sign In instead";
            } else {
                modalTitle.innerText = "Sign In to Kosha Hub";
                btn.innerText = "Sign In";
                toggleText.innerText = "Don't have an account?";
                toggleBtn.innerText = "Create Account instead";
            }
        }

        window.handleAuthSubmit = async function(e) {
            e.preventDefault();
            const email = document.getElementById("authEmail").value.trim();
            const password = document.getElementById("authPassword").value.trim();
            const errorEl = document.getElementById("authError");
            errorEl.classList.add("hidden");

            try {
                if (window.isSignUpMode) {
                    await createUserWithEmailAndPassword(auth, email, password);
                } else {
                    await signInWithEmailAndPassword(auth, email, password);
                }
            } catch (err) {
                console.error("Auth error:", err);
                let message = err.message;
                if (err.code === 'auth/email-already-in-use') {
                    message = "This email is already registered! Please switch to 'Sign In instead' below.";
                } else if (err.code === 'auth/invalid-credential' || err.code === 'auth/user-not-found' || err.code === 'auth/wrong-password') {
                    message = "Invalid email or password. If you don't have an account, click 'Create Account instead' below.";
                }
                errorEl.innerText = message;
                errorEl.classList.remove("hidden");
            }
        }

        window.logoutUser = async function() {
            try {
                await signOut(auth);
            } catch (err) {
                console.error("Logout error:", err);
            }
        }

        // Channels Management
        window.openNewChannelModal = function() {
            document.getElementById("newChannelNameInput").value = "";
            document.getElementById("newChannelModal").classList.remove("hidden");
            document.getElementById("newChannelNameInput").focus();
        }

        window.closeNewChannelModal = function() {
            document.getElementById("newChannelModal").classList.add("hidden");
        }

        window.createChannel = async function() {
            if (!auth.currentUser) return;
            const input = document.getElementById("newChannelNameInput");
            let channelName = input.value.trim().toLowerCase().replace(/\s+/g, '-');
            if (!channelName) return;

            try {
                await addDoc(collection(db, "channels"), {
                    name: channelName,
                    createdByUid: auth.currentUser.uid,
                    createdByName: window.currentUser,
                    timestamp: serverTimestamp()
                });
                closeNewChannelModal();
                switchChannel(channelName);
            } catch (err) {
                console.error("Error creating channel:", err);
            }
        }

        window.deleteChannel = async function(channelId, creatorUid, channelName) {
            if (!auth.currentUser || auth.currentUser.uid !== creatorUid) return;
            
            const confirmed = confirm("If you delete it you will lose all information in it, are you sure?");
            if (!confirmed) return;

            try {
                await deleteDoc(doc(db, "channels", channelId));
                if (window.currentChannel === channelName) {
                    switchChannel("General Lobby");
                }
            } catch (err) {
                console.error("Error deleting channel:", err);
            }
        }

        function loadChannels() {
            const listEl = document.getElementById("channelsList");
            if (!listEl) return;

            const q = query(collection(db, "channels"), orderBy("timestamp", "asc"));
            onSnapshot(q, (snapshot) => {
                let html = `
                    <button onclick="switchChannel('General Lobby')" id="btn-General-Lobby" class="w-full text-left px-3 py-2 rounded-lg ${window.currentChannel === 'General Lobby' ? 'bg-blue-600/20 text-blue-400 font-medium' : 'text-slate-300 hover:bg-slate-800'} text-sm transition flex items-center justify-between group">
                        <span># general-lobby</span>
                    </button>
                `;

                snapshot.forEach((docSnap) => {
                    const ch = docSnap.data();
                    if (ch.name === "general-lobby") return;

                    const isSelected = window.currentChannel === ch.name;
                    const canDelete = auth.currentUser && auth.currentUser.uid === ch.createdByUid;

                    html += `
                        <div class="w-full text-left px-3 py-2 rounded-lg ${isSelected ? 'bg-blue-600/20 text-blue-400 font-medium' : 'text-slate-300 hover:bg-slate-800'} text-sm transition flex items-center justify-between group">
                            <span onclick="switchChannel('${ch.name}')" class="truncate flex-1 cursor-pointer"># ${escapeHtml(ch.name)}</span>
                            ${canDelete ? `<button onclick="event.stopPropagation(); deleteChannel('${docSnap.id}', '${ch.createdByUid}', '${ch.name}')" class="text-xs text-red-400 hover:text-red-300 opacity-0 group-hover:opacity-100 px-1.5 py-0.5 rounded transition shrink-0">✕</button>` : ''}
                        </div>
                    `;
                });
                listEl.innerHTML = html;
            }, (error) => {
                console.error("Error loading channels:", error);
            });
        }

        window.switchChannel = function(channelName) {
            window.currentChannel = channelName;
            document.getElementById("activeChannelName").innerText = channelName;
            loadChannels();
            loadMessages();
        }

        window.handleFileSelected = function(input) {
            if (input.files && input.files[0]) {
                window.selectedFile = input.files[0];
                document.getElementById("attachmentName").innerText = window.selectedFile.name;
                const fileType = window.selectedFile.type;
                let badgeText = "FILE";
                if (fileType.startsWith('image/')) badgeText = "IMAGE";
                else if (fileType.startsWith('video/')) badgeText = "VIDEO";
                else if (fileType.startsWith('audio/')) badgeText = "AUDIO";
                
                document.getElementById("attachmentTypeBadge").innerText = badgeText;
                document.getElementById("attachmentPreview").classList.remove("hidden");
            }
        }

        window.clearAttachment = function() {
            window.selectedFile = null;
            document.getElementById("fileInput").value = "";
            document.getElementById("attachmentPreview").classList.add("hidden");
        }

        window.setReplyTo = function(id, user, text) {
            window.replyingToMessageId = id;
            window.replyingToData = { user, text };
            document.getElementById("replyingToUser").innerText = user;
            document.getElementById("replyingToText").innerText = text;
            document.getElementById("replyBar").classList.remove("hidden");
            document.getElementById("messageInput").focus();
        }

        window.cancelReply = function() {
            window.replyingToMessageId = null;
            window.replyingToData = null;
            document.getElementById("replyBar").classList.add("hidden");
        }

        // Upload media directly to Cloudinary using unsigned upload preset
        async function uploadFileToCloudinary(file) {
            const banner = document.getElementById("uploadProgressBanner");
            const textEl = document.getElementById("uploadProgressText");
            if (banner && textEl) {
                textEl.innerText = "Uploading";
                banner.classList.remove("hidden");
            }

            // Cloudinary treats both video and audio resources under the 'video' endpoint
            let resourceType = 'image';
            if (file.type.startsWith('video') || file.type.startsWith('audio')) {
                resourceType = 'video';
            }

            const formData = new FormData();
            formData.append("file", file);
            formData.append("upload_preset", UPLOAD_PRESET);

            try {
                const response = await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/${resourceType}/upload`, {
                    method: "POST",
                    body: formData
                });
                
                if (banner) banner.classList.add("hidden");

                if (!response.ok) {
                    throw new Error("Upload failed");
                }

                const data = await response.json();
                return {
                    name: file.name,
                    size: (file.size / (1024 * 1024)).toFixed(2) + " MB",
                    type: file.type,
                    url: data.secure_url,
                    publicId: data.public_id
                };
            } catch (err) {
                if (banner) banner.classList.add("hidden");
                console.error("Cloudinary upload error:", err);
                throw new Error("Upload failed. Please check your cloud name and upload preset.");
            }
        }

        // Send Message
        window.sendMessage = async function(e) {
            e.preventDefault();
            if (!auth.currentUser) return;

            const input = document.getElementById("messageInput");
            const text = input.value.trim();

            if (!text && !window.selectedFile) return;

            let mediaData = null;
            if (window.selectedFile) {
                try {
                    mediaData = await uploadFileToCloudinary(window.selectedFile);
                } catch (err) {
                    showNotification(err.message || "Failed to upload file.");
                    return;
                }
            }

            try {
                await addDoc(collection(db, "messages"), {
                    channel: window.currentChannel,
                    uid: auth.currentUser.uid,
                    user: window.currentUser,
                    text: text,
                    media: mediaData,
                    replyTo: window.replyingToData || null,
                    timestamp: serverTimestamp()
                });

                input.value = "";
                window.clearAttachment();
                window.cancelReply();
            } catch (err) {
                console.error("Error sending message: ", err);
                showNotification("Error sending message. Check Firestore permissions.");
            }
        }

        // Real-time listener for messages
        function loadMessages() {
            const feed = document.getElementById("messageFeed");
            if (!feed) return;
            feed.innerHTML = '<div class="text-center py-8 text-slate-500 text-sm">Loading messages...</div>';

            const q = query(collection(db, "messages"), orderBy("timestamp", "asc"));
            
            onSnapshot(q, (snapshot) => {
                feed.innerHTML = "";
                let count = 0;

                snapshot.forEach((docSnap) => {
                    const msg = docSnap.data();
                    const msgChannel = msg.channel || "General Lobby";
                    if (msgChannel !== window.currentChannel) return;

                    count++;
                    const isMe = (auth.currentUser && msg.uid && msg.uid === auth.currentUser.uid);
                    const div = document.createElement("div");
                    div.className = `flex flex-col ${isMe ? 'items-end' : 'items-start'} group`;

                    let replyHtml = '';
                    if (msg.replyTo) {
                        replyHtml = `
                            <div class="text-xs bg-slate-800/80 border-l-2 border-blue-500 px-2 py-1 mb-1 rounded text-slate-400">
                                <span class="font-semibold text-blue-400">@${escapeHtml(msg.replyTo.user)}:</span> ${escapeHtml(msg.replyTo.text)}
                            </div>
                        `;
                    }

                    let mediaHtml = '';
                    if (msg.media) {
                        const isVideo = msg.media.type && msg.media.type.startsWith('video');
                        const isAudio = msg.media.type && msg.media.type.startsWith('audio');
                        const isImage = msg.media.type && msg.media.type.startsWith('image');

                        if (isVideo) {
                            mediaHtml = `
                                <div class="mt-2 w-full max-w-sm rounded-xl overflow-hidden bg-slate-900 border border-slate-700">
                                    <video controls class="w-full max-h-60 object-contain bg-black" src="${msg.media.url}">
                                        Your browser does not support video playback.
                                    </video>
                                </div>
                            `;
                        } else if (isAudio) {
                            mediaHtml = `
                                <div class="mt-2 w-full max-w-sm rounded-xl p-3 bg-slate-900 border border-slate-700 flex flex-col gap-2">
                                    <div class="flex items-center space-x-2 text-xs text-slate-300 truncate">
                                        <span>🎵</span>
                                        <span class="truncate font-medium">${escapeHtml(msg.media.name || 'Audio Recording')}</span>
                                    </div>
                                    <audio controls preload="metadata" class="w-full h-10" src="${msg.media.url}">
                                        Your browser does not support audio playback.
                                    </audio>
                                </div>
                            `;
                        } else if (isImage) {
                            mediaHtml = `
                                <div class="mt-2 w-full max-w-sm rounded-xl overflow-hidden bg-slate-900 border border-slate-700">
                                    <a href="${msg.media.url}" target="_blank" rel="noopener noreferrer">
                                        <img src="${msg.media.url}" class="w-full max-h-60 object-contain bg-black hover:opacity-95 transition cursor-pointer" alt="Uploaded Image">
                                    </a>
                                </div>
                            `;
                        }
                    }

                    let deleteHtml = '';
                    if (isMe) {
                        deleteHtml = `<button onclick="deleteMessage('${docSnap.id}')" class="opacity-0 group-hover:opacity-100 text-[10px] text-red-400 hover:text-red-300 hover:underline transition ml-2 cursor-pointer">Delete</button>`;
                    }

                    div.innerHTML = `
                        <div class="flex items-center space-x-2 mb-1 px-1">
                            <span class="text-xs font-semibold text-slate-300">${escapeHtml(msg.user || 'Anon')}</span>
                            <button onclick="setReplyTo('${docSnap.id}', '${escapeHtml(msg.user || 'Anon')}', '${escapeHtml(msg.text || '[Media Upload]')}')" class="opacity-0 group-hover:opacity-100 text-[10px] text-blue-400 hover:underline transition">Reply</button>
                            ${deleteHtml}
                        </div>
                        <div class="w-[92%] sm:w-auto max-w-[92%] md:max-w-[70%] rounded-2xl px-4 py-3 text-sm shadow-md ${isMe ? 'bg-blue-600 text-white rounded-tr-none' : 'bg-slate-800 text-slate-200 border border-slate-700/80 rounded-tl-none'}">
                            ${replyHtml}
                            ${msg.text ? `<p class="whitespace-pre-wrap leading-relaxed">${escapeHtml(msg.text)}</p>` : ''}
                            ${mediaHtml}
                        </div>
                    `;
                    feed.appendChild(div);
                });

                if (count === 0) {
                    feed.innerHTML = '<div class="text-center py-12 text-slate-500 text-sm">No messages yet in this channel. Upload a video or audio file to get started!</div>';
                }
                feed.scrollTop = feed.scrollHeight;
            }, (error) => {
                console.error("Firestore read error:", error);
                feed.innerHTML = '<div class="text-center py-8 text-red-400 text-sm">Permission error. Make sure your Firestore rules are set to allow read/write.</div>';
            });
        }

        window.deleteMessage = async function(messageId) {
            if (!auth.currentUser) return;
            const confirmed = confirm("Are you sure you want to delete this message?");
            if (!confirmed) return;
            try {
                await deleteDoc(doc(db, "messages", messageId));
            } catch (err) {
                console.error("Error deleting message:", err);
                showNotification("Could not delete message. Check permissions.");
            }
        }

        function escapeHtml(str) {
            if (!str) return '';
            return String(str).replace(/[&<>'"]/g, 
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
            );
        }
    </script>
</body>
</html>
